<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b3a55">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="robots" content="noindex,nofollow"><title>Daily Office</title>
<style>
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font:17px/1.55 Georgia,serif;color:#222;background:#f4f1ea}
#bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:#2b3a55;color:#fff;padding:8px 12px;font:600 16px system-ui,sans-serif}
#bar button{background:none;border:1px solid #ffffff66;color:#fff;border-radius:6px;font-size:20px;padding:2px 10px}
#bar span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#side{position:fixed;top:0;left:0;bottom:0;width:min(88vw,340px);background:#fff;overflow-y:auto;padding:14px 16px 40px;font:15px/1.4 system-ui,sans-serif;z-index:10;transform:translateX(-102%);transition:transform .2s;border-right:1px solid #d8d2c4}
body.drawer #side{transform:none;box-shadow:0 0 30px #0006}
#side h3{margin:16px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#777;border-top:1px solid #eee;padding-top:9px}
#side label.f{display:block;margin:6px 0}#side label.f span{display:block;font-size:13px;color:#555}
#side select,#side input[type=date],#side input[type=text],#side input[type=file]{width:100%;padding:8px;margin:2px 0 4px;font:inherit;border:1px solid #bbb;border-radius:6px;background:#fff}
#side label.c{display:flex;gap:10px;align-items:flex-start;margin:8px 0}#side label.c input{width:20px;height:20px;margin-top:1px}
.closeBtn{width:100%;padding:10px;margin:0 0 4px;border:1px solid #bbb;border-radius:6px;background:#f2f2f2;font:600 15px system-ui}
.note{font-size:12px;color:#777;margin-bottom:4px}.hide{display:none!important}
.nav{display:flex;gap:6px;margin:6px 0}.nav button{white-space:nowrap;font-size:14px}.nav button,.seg button,#bibgo,.bib button{flex:1;padding:9px 6px;border:1px solid #bbb;background:#fafafa;border-radius:6px;font:inherit}
.seg{display:flex;margin:8px 0}.seg button{border-radius:0}.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
.seg button.on{background:#2b3a55;color:#fff;border-color:#2b3a55}
.bib{display:flex;gap:8px;align-items:center;margin:4px 0}.bib button{flex:none;padding:4px 8px;font-size:12px}
#main{padding:14px 12px 80px;max-width:900px;margin:0 auto}
.head{border-left:8px solid #888;background:#fff;padding:10px 14px;margin-bottom:14px;box-shadow:0 1px 3px #0001}
.head h1{margin:0;font-size:23px;line-height:1.25}.head .meta{font:13px system-ui,sans-serif;color:#666}.head ul{margin:6px 0 0;padding-left:18px;font:13px system-ui,sans-serif;color:#555}
.lnote{margin-top:8px;font:13px/1.45 system-ui,sans-serif;background:#fff8e1;border-left:3px solid #e0a800;padding:6px 10px}.lnote p{margin:3px 0}
.sec{background:#fff;padding:12px 16px;margin:10px 0;box-shadow:0 1px 3px #0001}
.sec>h3{margin:0 0 8px;font:600 12.5px system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#2b3a55;display:flex;justify-content:space-between;gap:8px}
.pg{font-weight:400;color:#999;font-size:12px;white-space:nowrap}
.para{margin:0 0 10px}.ln{margin:0}.ln.role{display:flex;gap:10px}.ln.role b{flex:none;width:5.6em;font-weight:600}
.rub{color:#a33;font-style:italic;font-size:15px}.lab{font:600 12px system-ui,sans-serif;color:#777;margin-bottom:2px}
.rd h4,.ps h4{margin:10px 0 4px;font-size:15px}.ref{font-weight:400;color:#888;font-size:13px}sup{color:#a33;font-size:11px;margin-right:2px}
.v{margin:0 0 2px}.v.opt{font-style:italic;color:#555}.v.gap{color:#aaa;margin-left:1em}.resp{font-style:italic}.miss{color:#a66}#speakbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;flex-direction:column;gap:6px;background:#2b3a55;color:#fff;padding:8px 10px;font:14px system-ui}#speakbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#speakbar input[type=range]{width:100%;margin:0}#speakbar .sbrow{display:flex;gap:6px}#speakbar button{flex:1;background:#fff;color:#2b3a55;border:0;border-radius:5px;padding:7px 4px;font:inherit}#speakbar #spkpause{flex:2}.spoken{background:#fff;padding:16px 18px;white-space:pre-wrap;font:18px/1.6 Georgia,serif;margin:12px 0;box-shadow:0 1px 3px #0001}#toast{display:none;position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#223;color:#fff;padding:12px 14px;border-radius:8px;font:15px system-ui;white-space:pre-wrap;box-shadow:0 2px 10px #0006}.note{color:#777}.err{background:#fee;padding:14px}
.collect p{margin:0}.hymn{border:1px dashed #bbb;background:#fafaf5;padding:6px 12px;margin:12px 0;font:14px system-ui,sans-serif;color:#555}.hymn .blank{color:#bbb}
#instwrap{max-width:900px;margin:0 auto;padding:10px 12px 0}#instwrap:empty{padding:0}
.inst{background:#fff;border-left:6px solid #2b3a55;padding:10px 14px;margin-bottom:10px;box-shadow:0 1px 3px #0001;font:15px/1.45 system-ui,sans-serif}.inst p{margin:6px 0}.inst .nav{margin:8px 0 2px}.inst .nav button{padding:11px 8px}.inst #instbtn,.inst [data-getbible]{background:#2b3a55;color:#fff;border-color:#2b3a55;font-weight:600}
#upd{display:none;position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#2b3a55;color:#fff;padding:12px 14px;border-radius:8px;font:15px system-ui;box-shadow:0 2px 10px #0006}#upd button{margin-left:8px;padding:7px 12px;border-radius:6px;border:0;font:inherit}
details.grp{border-top:1px solid #eee}
details.grp>summary{list-style:none;cursor:pointer;padding:12px 2px;font:600 12.5px system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#555;display:flex;justify-content:space-between;align-items:center;-webkit-tap-highlight-color:transparent}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:'\25B8';font-size:15px;color:#999}
details.grp[open]>summary{color:#2b3a55}details.grp[open]>summary::after{content:'\25BE'}
details.grp>.gb{padding:0 0 10px}
@media (min-width:980px){
  body:not(.x) #instwrap{margin-left:340px;max-width:none;padding-right:40px}#instwrap>*{max-width:860px}
  #bar{display:none}.closeBtn{display:none}#side{transform:none;box-shadow:none;width:320px}body:not(.x) #main{margin-left:340px;max-width:none;padding-right:40px}#main>*{max-width:860px}
}
@media print{#bar,#side{display:none!important}body{background:#fff}#main{margin:0;padding:0}.sec,.head{box-shadow:none}}
</style></head>
